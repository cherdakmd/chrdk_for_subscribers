# Собирает мод на каждый push и кладёт готовый jar в артефакты сборки.
# Дополнительно: по тегу v* или по ручному запуску с флагом release создаётся GitHub Release с jar.

name: build
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: "Создать GitHub Release с jar"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chrdk-pantheon
          path: build/libs/
      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version=//p' gradle.properties)
          TAG="v${VERSION}"
          cat > /tmp/notes.md <<'EOF'
          Мод **«Чердак Бессмертных»** — увековечивает подписчиков канала в мире выживания.

          ## Что умеет

          **Ритуал чердака**
          1. Смастери **Пустую печать** (бумага + чернильный мешок + золотой самородок).
          2. Переименуй её в **наковальне** в ник подписчика — печать подписывается именем.
          3. Щёлкни печатью по **Постаменту подписчика** → печать впечатывается, на постаменте встаёт статуэтка, в воздух уходит пыль, имя попадает в летопись.
          4. **Shift + правый клик** — снять фигурку, печать с именем вернётся в руки.

          **Ещё в v0.1**
          - **Чердачный алтарь** — правый клик показывает сводку: сколько имён на чердаке и кто пришёл последним.
          - **Свиток Имён** — носимый список подписчиков, правый клик читает летопись в чат.
          - Команды `/attic` и `/чердак`: `list`, `add`, `remove`, `tier`, `seal`, `scroll`, `stats`.
          - Летопись хранится **внутри мира** — одиночная игра, бэкапы и переносы работают вместе с именами.

          ## Установка

          1. Minecraft **26.3** + **Fabric Loader 0.19.5+**
          2. В папку `mods/` положи jar из этого релиза и [Fabric API](https://modrinth.com/mod/fabric-api) для 26.3
          3. Мод ставится и на клиент, и на сервер

          Собрано Fabric Loom, Java 25, официальные маппинги Mojang.
          EOF
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" build/libs/*.jar \
            --title "Чердак Бессмертных ${TAG}" \
            --target "$GITHUB_SHA" \
            --notes-file /tmp/notes.md
