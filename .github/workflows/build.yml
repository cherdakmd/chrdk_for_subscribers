# Собирает мод на каждый push и кладёт готовый jar в артефакты сборки.
# Дополнительно: по тегу v* или по ручному запуску с флагом release создаётся GitHub Release с jar.

name: build
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: "Создать GitHub Release с jar"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chrdk-pantheon
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version=//p' gradle.properties)
          TAG="v${VERSION}"
          cat > /tmp/notes.md <<'EOF'
          Мод **«Чердак Бессмертных»** — увековечивает подписчиков канала в мире выживания.

          ## Что умеет

          **Ритуал чердака**
          1. Смастери **Пустую печать** (бумага + чернильный мешок + золотой самородок).
          2. Переименуй её в **наковальне** в ник подписчика — печать подписывается именем.
          3. Щёлкни печатью по **Постаменту подписчика** → печать впечатывается, на постаменте встаёт статуэтка, в воздух уходит пыль, имя попадает в летопись.
          4. **Shift + правый клик** — снять фигурку, печать с именем вернётся в руки.

          **Ещё в v0.1**
          - **Чердачный алтарь** — правый клик показывает сводку: сколько имён на чердаке и кто пришёл последним.
          - **Свиток Имён** — носимый список подписчиков, правый клик читает летопись в чат.
          - Команды `/attic` и `/чердак`: `list`, `add`, `remove`, `tier`, `seal`, `scroll`, `stats`.
          - Летопись хранится **внутри мира** — одиночная игра, бэкапы и переносы работают вместе с именами.

          ## Что нового в v0.2 — фигурки подписчиков

          - На постаменте теперь стоит **настоящая 3D-модель игрока** вместо статуэтки.
          - Если ник подписчика — реальный майнкрафт-аккаунт, подставляется **его скин** (модель рук Steve/Alex).
          - Для остальных — **процедурный аватар**: один из 48 сгенерированных скинов, выбранный по нику
            (для одного и того же имени всегда одинаковый). Превью — в репозитории, `docs/figurine_skins.png`.
          - Размер фигурки зависит от **тира**: `/attic tier <ник> 1..5` — от небольшой статуэтки до фигуры
            почти в человеческий рост.
          - Постамент запоминает поворот: фигурка смотрит туда, куда смотрел игрок при установке.

          ## Что нового в v0.3 — Обелиск Имён, портреты и свет

          - **Обелиск Имён** — каменный столп-каталог. Правый клик: сводка по чердаку, последние пришедшие
            и **Книга Имён** в руки.
          - **Книга Имён** — обычная писаная книга со всей летописью: первая страница со сводкой и первыми
            именами, дальше список с тирами и пометкой потухших. Такую книгу можно листать, положить в сундук
            или подарить. Перепечатать — снова щёлкнуть по обелиску.
          - **Портретная рама** — место подписчика на стене: в раме висит **голова подписчика** (настоящий
            скин или процедурный аватар). Ставится как обычный блок, поворачивается на игрока, ритуал печати —
            тот же, что у постамента. Shift + правый клик — снять портрет и забрать печать.
          - **Чердачный канделябр** — латунный светильник на три свечи (свет 14), слегка дымит.
          - В креатив-вкладку «Чердак Бессмертных» добавлены новые блоки, у новых блоков есть рецепты,
            лут-таблицы и локализации RU/EN.

          ## Что нового в v0.4 — Аура Пантеона, дары и вехи

          - **Аура Пантеона.** Фигурки и портреты *активных* подписчиков в радиусе 16 блоков поддерживают игрока:
            1 фигурка → Speed, 10 → Haste, 50 → Resistance, 100 → Regeneration, 500 → Strength.
            Ступень показывается в чате при входе в ауру и видна у алтаря. Включается и выключается: `/attic aura on|off`.
          - **Подношения.** Правый клик любым предметом по занятому святилищу → подписчик принимает дар и благодарит
            подарком по своему тиру (от бумаги и золотых самородков до изумрудов, алмазов и золотых яблок).
            На каждое святилище — раз в игровой день. Счётчик даров виден в книге, книжке и у обелиска.
          - **Вехи.** 1 / 10 / 50 / 100 / 500 / 1000 имён: чердак отмечает рубеж событием в мире
            (звук, искры, сообщение всем) и записью в летописи; сводка вех — на последней странице Книги Имён.
          - **Импорт и экспорт списков.** `/attic export` выгружает летопись в `config/chrdk_pantheon/subscribers.txt`
            (ник,тир,источник), `/attic import` вписывает всех из файла разом — удобно заливать выгрузку подписчиков.
          - `/attic aura`, `/attic stats` показывают ступень ауры, число святилищ, дары и ближайшую веху.

          ## Что нового в v0.5.1 — ларь подписчика, декор и каталог в чате

          - **Сундук подписчика** — личный ларь на 27 слотов с биркой: щёлкни по нему именной печатью,
            и на ларе появится имя подписчика, а внутри — **приветственный подарок** (по тиру).
            Пока ларь не открывали, он подсвечивается изнутри. Содержимое выпадает при сносе.
          - **Декор чердака** — **Вековая пыль** (слой, как ковёр), **Чердачная паутина** (крестовая модель,
            как ванильная паутина) и **Витраж чердака** — цветное стекло с гербом канала. Все три крафтятся.
          - **Каталог чердака в чате** — обелиск и `/attic list` печатают список **кликабельных имён**:
            клик по имени открывает карточку подписчика, где можно поставить тир, выдать печать,
            вернуть в строй или потушить.
          - Новые команды: `/attic info <ник>`, `/attic find <текст>`, `/attic top [N]`,
            `/attic toggle <ник>` (вернуть в строй / потушить).
          - Аура считает только фигурки и портреты: лари — это склад, они бафф не дают.

          ## Что нового в v0.6 — ритуальный крафт фигурок

          - **Фигурка подписчика — предмет**: хранит ник и тир, тир виден в подсказке предмета.
          - **Отливка в верстаке**: именная печать + свеча + золотой слиток + бумага → фигурка
            (имя с печати переносится, печать расходуется).
          - **Установка на постамент**: фигурка водружается на Постамент подписчика; если подписчик уже
            в летописи, тир повышается, запись не дублируется. Снятие возвращает фигурку с ником и тиром
            (с портретной рамы и ларя — именную печать).
          - **Возвышение у алтаря**: две одинаковые фигурки одного ника и тира в двух руках плюс ресурсы
            из инвентаря: 1→2 — 4 железных слитка, 2→3 — 2 алмаза, 3→4 — слиток незерита,
            4→5 — звезда Незера + дыхание дракона + 4 золотых слитка.
          - **Понижение**: Чердачный резец (палка + железо) через наковальню снижает тир фигурки на один.
          - **Аура считает тиры**: фигурка или портрет тира N даёт N очков ауры.
          - Команда `/attic figurine <ник> [тир]` и кнопка «[выдать фигурку]» в карточке подписчика.

          ## Установка

          1. Minecraft **26.3** + **Fabric Loader 0.19.5+**
          2. В папку `mods/` положи jar из этого релиза и [Fabric API](https://modrinth.com/mod/fabric-api) для 26.3
          3. Мод ставится и на клиент, и на сервер

          Собрано Fabric Loom, Java 25, официальные маппинги Mojang.
          EOF
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          JARS=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | sort | tr '\n' ' ')
          gh release create "$TAG" $JARS \
            --title "Чердак Бессмертных ${TAG}" \
            --target "$GITHUB_SHA" \
            --notes-file /tmp/notes.md
