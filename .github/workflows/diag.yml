# Диагностика: снимает точные сигнатуры классов Minecraft 26.3 (javap) и коммитит их в docs/api.
# Нужна, потому что рабочая среда без JDK не может посмотреть сигнатуры напрямую.
#
# Запускается только при изменении самого этого файла (или вручную), чтобы не плодить коммиты.

name: diag

on:
  push:
    paths:
      - '.github/workflows/diag.yml'

permissions:
  contents: write

jobs:
  dump:
    if: "!contains(github.event.head_commit.message, '[api-dump]')"
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build (может упасть — нужен только скачанный Minecraft)
        run: ./gradlew compileJava compileClientJava --no-daemon || true
      - name: найти jar Minecraft
        run: |
          JAR=$(find ~/.gradle/caches -name "minecraft-merged-*.jar" | head -1)
          if [ -z "$JAR" ]; then JAR=$(find ~/.gradle/caches -name "*.jar" -path "*minecraft*" | head -1); fi
          echo "MINECRAFT_JAR=$JAR" >> "$GITHUB_ENV"
          echo "нашёл: $JAR"
      - name: снять сигнатуры
        run: |
          rm -rf docs/api && mkdir -p docs/api
          for cls in \
            net.minecraft.client.renderer.OrderedSubmitNodeCollector \
            net.minecraft.client.renderer.feature.ModelFeatureRenderer \
            net.minecraft.client.renderer.blockentity.BlockEntityRenderer \
            net.minecraft.client.renderer.blockentity.BlockEntityRendererProvider \
            'net.minecraft.client.renderer.blockentity.BlockEntityRendererProvider$Context' \
            net.minecraft.client.renderer.state.level.CameraRenderState \
            net.minecraft.client.renderer.texture.OverlayTexture \
            net.minecraft.client.renderer.PlayerSkinRenderCache \
            'net.minecraft.client.renderer.PlayerSkinRenderCache$RenderInfo' \
            net.minecraft.world.entity.player.PlayerSkin \
            net.minecraft.world.entity.player.PlayerModelType \
            net.minecraft.client.model.geom.ModelLayerLocation \
            net.minecraft.client.model.geom.builders.LayerDefinition \
            net.minecraft.client.model.geom.builders.MeshDefinition \
            net.minecraft.client.model.geom.builders.PartDefinition \
            net.minecraft.client.model.geom.builders.CubeListBuilder \
            net.minecraft.client.model.geom.builders.PartPose \
            net.minecraft.client.model.geom.builders.CubeDeformation \
            net.minecraft.client.model.player.PlayerModel \
            net.minecraft.client.model.HumanoidModel \
            net.minecraft.util.Mth \
            com.mojang.blaze3d.vertex.PoseStack ; do
            name=$(echo "$cls" | tr '.' '_' | tr '$' '_')
            {
              echo "### $cls"
              javap -cp "$MINECRAFT_JAR" "$cls" 2>&1 || echo "FAILED (класс не найден в этом jar)"
            } > "docs/api/$name.txt"
          done
          # com.mojang.math.Axis лежит не в самом minecraft.jar — ищем по всем jar'ам кэша
          {
            echo "### com.mojang.math.Axis (поиск по всем jar)"
            for jar in $(find ~/.gradle/caches -name "*.jar" | head -400); do
              if javap -cp "$jar" com.mojang.math.Axis > /tmp/axis.txt 2>/dev/null; then
                echo "found in: $jar"
                cat /tmp/axis.txt
                break
              fi
            done
          } > docs/api/com_mojang_math_Axis.txt
          ls -la docs/api
      - name: закоммитить дамп
        run: |
          git config user.name "chrdk-ci"
          git config user.email "ci@users.noreply.github.com"
          git add docs/api
          git commit -m "ci: дамп сигнатур API 26.3 [api-dump]" || echo "нечего коммитить"
          git push || echo "push не удался"
